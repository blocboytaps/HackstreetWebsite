{% extends "base.html" %}
{% block title %}Hackstreet — The Road from Bree to Moria{% endblock %}
{% block body_class %}overworld{% endblock %}

{% block content %}
<main id="main" class="map-shell">
  <h1 class="visually-hidden">Hackstreet — travel the road from Bree to Moria</h1>

  <div class="map-frame">
    <svg class="map-svg" viewBox="0 0 1200 780" role="group"
         aria-label="A map of the road between Bree and Moria. Two locations can be visited."
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>
          .m-place  { font-family: "Cinzel", Georgia, serif; font-weight: 700; fill: var(--ink); }
          .m-note   { font-family: "EB Garamond", Georgia, serif; font-style: italic; fill: var(--ink-muted); }
          .m-tiny   { font-family: "EB Garamond", Georgia, serif; font-style: italic; fill: var(--ink-muted); }
          .compass  { font-family: "Cinzel", Georgia, serif; fill: var(--frame-soft); }
        </style>
        <radialGradient id="fog" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="#efe6c4" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#efe6c4" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- faint fog / age stains -->
      <circle cx="1010" cy="250" r="300" fill="url(#fog)"/>
      <circle cx="240"  cy="640" r="320" fill="url(#fog)"/>

      <!-- inner border -->
      <rect x="28" y="28" width="1144" height="604" fill="none"
            stroke="var(--frame-soft)" stroke-width="2.5"/>

      <!-- ===== rivers ===== -->
      <g aria-hidden="true" fill="none" stroke="#9db08a" stroke-width="3" opacity=".8" stroke-linecap="round">
        <path d="M 1000 70 Q 940 220 980 330 Q 1010 420 940 470 Q 880 510 900 585"/>
        <path d="M 120 470 Q 260 500 360 470 Q 470 440 560 500"/>
      </g>
      <text class="m-tiny" x="1006" y="150" font-size="16" transform="rotate(70 1006 150)" aria-hidden="true">the Bruinen</text>

      <!-- ===== forests (tree clusters) ===== -->
      <g aria-hidden="true" fill="#7f8b5c" opacity=".9">
        <!-- Chetwood, east of Bree -->
        <g transform="translate(330 150)">
          <path d="M0,14 L7,-4 L14,14 Z"/><path d="M14,16 L21,-2 L28,16 Z"/>
          <path d="M28,14 L35,-4 L42,14 Z"/><path d="M8,22 L15,4 L22,22 Z"/>
          <path d="M22,22 L29,4 L36,22 Z"/>
        </g>
        <!-- Wood by the road -->
        <g transform="translate(470 330)">
          <path d="M0,12 L6,-3 L12,12 Z"/><path d="M12,14 L18,-1 L24,14 Z"/>
          <path d="M24,12 L30,-3 L36,12 Z"/>
        </g>
      </g>
      <text class="m-tiny" x="332" y="192" font-size="17" aria-hidden="true">Chetwood</text>

      <!-- ===== dotted travel route ===== -->
      <path id="route" d="M 250 224 Q 500 300 742 458" fill="none"
            stroke="var(--route)" stroke-width="3" class="route-line"/>

      <!-- ===== The Shire (flavour, not a link) ===== -->
      <circle cx="120" cy="112" r="6" fill="var(--ink-muted)"/>
      <text class="m-tiny" x="138" y="118" font-size="22">the Shire</text>

      <!-- ===== Weathertop (flavour) ===== -->
      <g aria-hidden="true" stroke="var(--ink-muted)" stroke-width="2" fill="none">
        <path d="M 452 372 L 470 344 L 488 372"/>
      </g>
      <text class="m-tiny" x="470" y="392" font-size="18" text-anchor="middle" aria-hidden="true">Weathertop</text>

      <!-- ===== Compass rose (mouse-following needle) ===== -->
      <g transform="translate(1010 130)">
        <circle r="46" fill="none" stroke="var(--frame-soft)" stroke-width="2"/>
        <g stroke="var(--frame-soft)" stroke-width="1.5" aria-hidden="true">
          <line x1="0" y1="-46" x2="0" y2="-38"/><line x1="0" y1="46" x2="0" y2="38"/>
          <line x1="-46" y1="0" x2="-38" y2="0"/><line x1="46" y1="0" x2="38" y2="0"/>
        </g>
        <text class="compass" x="0" y="-54" font-size="20" text-anchor="middle">N</text>
        <g id="compass-needle" aria-hidden="true">
          <polygon points="0,-40 6,2 -6,2" fill="var(--bree)"/>
          <polygon points="0,40 6,-2 -6,-2" fill="var(--frame-soft)"/>
          <circle r="3.5" fill="var(--frame)"/>
        </g>
      </g>

      <!-- ===== BREE marker (link -> /bree) ===== -->
      <a href="{{ url_for('bree') }}"
         class="marker" data-place="Bree"
         role="link" aria-label="Travel to Bree — the Warden's Gate.">
        <text class="m-place" x="245" y="180" font-size="42" text-anchor="middle">Bree</text>
        <circle class="halo" cx="215" cy="212" r="20" fill="none" stroke="var(--bree)" stroke-width="2"/>
        <circle cx="215" cy="212" r="15" fill="none" stroke="var(--bree)" stroke-width="2.5"/>
        <circle class="dot" cx="215" cy="212" r="9" fill="var(--bree)" style="color: var(--bree)"/>
        <text class="m-note" x="215" y="258" font-size="21" text-anchor="middle">the Warden's Gate</text>
      </a>

      <!-- ===== Misty Mountains (decorative) ===== -->
      <g aria-hidden="true" stroke="var(--ink-muted)" stroke-width="2.5" fill="none" stroke-linejoin="round">
        <path d="M 792 470 L 838 420 L 872 462 L 910 405 L 952 470"/>
        <path d="M 820 486 L 860 448 L 900 486"/>
      </g>

      <!-- ===== Rivendell (flavour) ===== -->
      <circle cx="930" cy="330" r="5" fill="var(--ink-muted)"/>
      <text class="m-tiny" x="944" y="335" font-size="19" aria-hidden="true">Rivendell</text>

      <!-- ===== MORIA marker (link -> /moria) ===== -->
      <a href="{{ url_for('moria') }}"
         class="marker" data-place="Moria"
         role="link" aria-label="Travel to Moria — the Doors of Durin.">
        <circle class="halo" cx="760" cy="470" r="22" fill="none" stroke="var(--moria)" stroke-width="2"/>
        <circle cx="760" cy="470" r="16" fill="none" stroke="var(--moria)" stroke-width="2.5"/>
        <circle class="dot" cx="760" cy="470" r="10" fill="var(--moria)" style="color: var(--moria)"/>
        <text class="m-place" x="760" y="545" font-size="40" text-anchor="middle">Moria</text>
        <text class="m-note" x="760" y="576" font-size="21" text-anchor="middle">the Doors of Durin</text>
      </a>
      <text class="m-tiny" x="820" y="602" font-size="20" text-anchor="middle" aria-hidden="true">The Misty Mountains</text>

      <!-- ===== Lothlorien (flavour) ===== -->
      <circle cx="980" cy="612" r="6" fill="var(--ink-muted)"/>
      <text class="m-tiny" x="998" y="618" font-size="21">Lothlórien</text>
    </svg>
  </div>

  <p class="map-caption">Click a marker to travel to that stronghold.</p>
</main>

<button id="sound-toggle" class="sound-toggle" type="button"
        aria-pressed="false" aria-label="Toggle ambient music" title="Ambient music">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M11 5 6 9H2v6h4l5 4V5z"/>
    <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/>
    <path class="wave" d="M18.5 5.5a9 9 0 0 1 0 13"/>
  </svg>
</button>
{% endblock %}
