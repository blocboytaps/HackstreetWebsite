<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hackstreet{% endblock %}</title>
  <meta name="description" content="{% block desc %}A Lord of the Rings themed university CTF — travel the road from Bree to Moria.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip" href="#main">Skip to content</a>
  <div class="page">{% block content %}{% endblock %}</div>
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='js/fx.js') }}"
          data-static="{{ url_for('static', filename='') }}" defer></script>
</body>
</html>
